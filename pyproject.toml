[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turnpoint"
version = "0.1.0"
description = "Outcome-grounded analysis of dyadic conversational turns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
